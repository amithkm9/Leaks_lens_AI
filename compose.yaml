name: leaklens
x-backend: &backend
  build: ./backend
  env_file: .env
  environment: &environment
    DATABASE_URL: postgresql+psycopg://leaklens:${POSTGRES_PASSWORD:?Run setup first}@postgres:5432/leaklens
    DATA_DIR: /data
    LOCAL_REPO_ROOT: /data/repos
    REDIS_URL: redis://redis:6379/0
    JOB_MODE: rq
    ALLOWED_ORIGIN: ${COMPOSE_ORIGIN:-http://127.0.0.1:8080}
  volumes:
    - app_data:/data
  init: true
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  mem_limit: 2g
  pids_limit: 150
services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: leaklens
      POSTGRES_USER: leaklens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup first}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U leaklens -d leaklens']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    restart: 'no'
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    <<: *backend
    command: [rq, worker, --url, 'redis://redis:6379/0', leaklens]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  retention:
    <<: *backend
    command: [sh, -c, 'while true; do python -m app.cli purge-raw; python -m app.cli recover-jobs; sleep 3600; done']
    depends_on:
      migrate: {condition: service_completed_successfully}
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:8080:8080']
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/api/ready']
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  app_data:
