[project]
name = "leaklens"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4",
  "redis>=5,<7", "rq>=2.2,<3", "python-multipart>=0.0.20,<1", "pwdlib[argon2]>=0.2,<1",
  "httpx>=0.28,<1", "pypdf>=5,<7", "presidio-analyzer>=2.2,<3",
  "fastmcp>=3.4.5,<4", "langgraph>=1,<2", "anthropic>=0.50,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
